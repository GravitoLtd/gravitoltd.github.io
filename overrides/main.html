{% extends "base.html" %}

{% block site_meta %}
  {{ super() }}

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="https://docs.gravito.net/img/social-preview.png">
  <meta property="og:url" content="{{ config.site_url }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ config.site_name }}">
  <meta name="twitter:description" content="{{ config.site_description }}">
  <meta name="twitter:image" content="https://docs.gravito.net/img/social-preview.png">
{% endblock %}

{% block footer %}
<footer>
    <div class="rst-footer-buttons" role="navigation" aria-label="Footer Navigation">
        {% if page.previous_page %}
        <a href="{{ page.previous_page.url | url }}" class="btn btn-neutral float-left" title="{{ page.previous_page.title }}">
            <span class="icon icon-circle-arrow-left"></span>
            Previous
        </a>
        {% endif %}

        {% if page.next_page %}
        <a href="{{ page.next_page.url | url }}" class="btn btn-neutral float-right" title="{{ page.next_page.title }}">
            Next
            <span class="icon icon-circle-arrow-right"></span>
        </a>
        {% endif %}
    </div>

    <hr>

    <div class="gravito-footer">
        © 2026 Gravito. All rights reserved.
    </div>
</footer>
{% endblock %}
