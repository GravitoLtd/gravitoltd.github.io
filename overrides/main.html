{% extends "base.html" %}

{% block footer %}
<footer>
    <div class="rst-footer-buttons" role="navigation" aria-label="Footer Navigation">
        {% if page.previous_page %}
        <a href="{{ page.previous_page.url | url }}" class="btn btn-neutral float-left" title="{{ page.previous_page.title }}">
            <span class="icon icon-circle-arrow-left"></span>
            Previous
        </a>
        {% endif %}

        {% if page.next_page %}
        <a href="{{ page.next_page.url | url }}" class="btn btn-neutral float-right" title="{{ page.next_page.title }}">
            Next
            <span class="icon icon-circle-arrow-right"></span>
        </a>
        {% endif %}
    </div>

    <hr>

    <div class="gravito-footer">
        © 2026 Gravito. All rights reserved.
    </div>
</footer>
{% endblock %}
