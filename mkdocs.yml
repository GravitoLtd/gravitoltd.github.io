      #- Frequently Asked Questions: 'Getting_started/Frequently_Asked_Questions.md'
      - Register: 'Getting_started/Register.md'
      - Support: 'Getting_started/Support.md'
      - Release Notes: 'Getting_started/Release_Notes.md'
  - Consent Managment:
      - IAB TCF: 'Consent_Management/Iab_tcf.md'
      - Google Consent Mode: 'Consent_Management/Google_consent_mode.md'
      - Microsoft Consent Mode: 'Consent_Management/Microsoft_consent_mode.md'
      - Amazon Consent Mode : 'Consent_Management/Amazon_consent_mode.md'
  - Gravito CMP (New):
      - Getting Started: 'Gravito_V6_CMP/Getting_Started.md'
      - Setup and Design: 'Gravito_V6_CMP/Setup_and_Design.md'
      - Customization: 'Gravito_V6_CMP/Customization.md'
      - Components: 'Gravito_V6_CMP/Components.md'
      - Deployment: 'Gravito_V6_CMP/Deployment.md'
