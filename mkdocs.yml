site_name: Gravito Documentation
site_url: https://docs.gravito.net/
site_description: Gravito documentation for consent management, privacy infrastructure, SDKs and developer integrations.


theme:
  name: readthedocs
  logo: 'img/logo.png'  # Path to your custom logo
  favicon: 'img/favicon-gravito.png'  # Optional: Path to your favicon
  custom_dir: overrides
  # custom_dir: overrides  # Optional: Specify the custom directory if needed
  palette:
    primary: 'indigo'
    accent: 'orange'
  font: 
    text: 'Roboto'
    code: 'Roboto Mono'

extra_css:
  - css/custom.css  # Path to your custom CSS file

extra_javascript:
  - js/modal.js  # Your custom JavaScript file
  - js/motomo.js #motomo analytics
  - js/copy-code.js  #copy code
  #- js/announcement.js #announcement

nav:
